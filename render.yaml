services:
  - type: web
    name: trustvault-clamav-bridge
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./clamav-bridge/Dockerfile
    dockerContext: ./clamav-bridge
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: CLAMAV_SCAN_TOKEN
        sync: false
